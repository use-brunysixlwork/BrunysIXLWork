<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultraviolet Proxy Search</title>

  <!-- Include Ultraviolet JS Scripts -->
  <script src="/ixl/uv/uv.bundle.js" defer=""></script>
  <script src="/ixl/uv/uv.config.js" defer=""></script>
  <script src="/ixl/register-sw.js" defer=""></script>
  <script src="/ixl/search.js" defer=""></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #fff;
      margin: 0;
      padding: 0;
    }

    .header {
      text-align: center;
      padding: 20px;
      background-color: #333;
    }

    .header h1 {
      margin: 0;
    }

    .form-container {
      text-align: center;
      padding: 20px;
    }

    iframe {
      width: 100%;
      height: 500px;
      border: none;
    }

    .tab-bar {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
    }

    .tab {
      background-color: #444;
      padding: 10px;
      cursor: pointer;
    }

    .active-tab {
      background-color: #666;
    }

    .tab-close {
      font-size: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Ultraviolet Proxy Search</h1>
  </div>

  <div class="form-container">
    <form id="uv-form">
      <input id="uv-search-engine" value="https://www.google.com/search?q=%s" type="hidden"/>
      <input class="url-input" id="uv-address" type="text" placeholder="Search Google or type a URL" class="form__input"/>
      <button type="submit">Search</button>
    </form>
    <div class="desc left-margin">
      <p id="uv-error"></p>
      <pre id="uv-error-code"></pre>
    </div>
  </div>

  <!-- Iframe to display search results using UV Proxy -->
  <iframe id="uv-iframe" src="" name="uv-iframe"></iframe>

  <script src="index.js" defer=""></script>
</body>
</html>
