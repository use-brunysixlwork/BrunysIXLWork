<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>New Tab</title>
  <link rel="icon" id="favicon" href="https://ssl.gstatic.com/chrome/newtab/favicon-32.png">
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background-color: #f1f3f4;
      font-family: 'Roboto', sans-serif;
    }

    .navbar {
      display: flex;
      padding: 8px;
      background: #e8eaed;
      align-items: center;
      border-bottom: 1px solid #ccc;
    }

    #uv-form {
      flex: 1;
      display: flex;
    }

    .url-input {
      width: 100%;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
      background: white;
    }

    .tabs {
      display: flex;
      background-color: #d7dadc;
      padding: 4px;
      gap: 8px;
      overflow-x: auto;
      align-items: center;
    }

    .tab {
      padding: 6px 12px;
      background: white;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      white-space: nowrap;
    }

    .tab.active {
      background: #c2e7ff;
    }

    .tab-close {
      margin-left: 6px;
      color: #999;
      cursor: pointer;
    }

    .new-tab-btn {
      padding: 6px 12px;
      background: #e0e0e0;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }

    iframe {
      width: 100%;
      height: calc(100vh - 108px);
      border: none;
    }

    .desc {
      display: none;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <form id="uv-form">
      <input id="uv-search-engine" value="https://www.google.com/search?q=%s" type="hidden"/> 
      <input class="url-input" id="uv-address" type="text" placeholder="Search Google or type an URL"/>
    </form>
  </div>

  <div class="tabs" id="tabs">
    <!-- Tabs will go here -->
    <div class="new-tab-btn" onclick="createTab()">+</div>
  </div>

  <div class="desc left-margin">
    <p id="uv-error"></p>
    <pre id="uv-error-code"></pre>
  </div>

  <div id="iframe-container"></div>

  <!-- UV Scripts -->
  <script src="/ixl/uv/uv.bundle.js" defer></script>
  <script src="/ixl/uv/uv.config.js" defer></script>
  <script src="/ixl/register-sw.js" defer></script>
  <script src="/ixl/search.js" defer></script>
  <script src="/ixl/index.js" defer></script>
</body>
</html>
